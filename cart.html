<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>EShopper - Bootstrap Shop Template</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Free HTML Templates" name="keywords">
    <meta content="Free HTML Templates" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet"> 

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <!-- Topbar Start -->
    <div class="container-fluid">
        <div class="row bg-secondary py-2 px-xl-5">
            <div class="col-lg-6 d-none d-lg-block">
                <div class="d-inline-flex align-items-center">
                    <a class="text-dark" href="">FAQs</a>
                    <span class="text-muted px-2">|</span>
                    <a class="text-dark" href="">Help</a>
                    <span class="text-muted px-2">|</span>
                    <a class="text-dark" href="">Support</a>
                </div>
            </div>
            <div class="col-lg-6 text-center text-lg-right">
                <div class="d-inline-flex align-items-center">
                    <a class="text-dark px-2" href="">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a class="text-dark px-2" href="">
                        <i class="fab fa-twitter"></i>
                    </a>
                    <a class="text-dark px-2" href="">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                    <a class="text-dark px-2" href="">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a class="text-dark pl-2" href="">
                        <i class="fab fa-youtube"></i>
                    </a>
                </div>
            </div>
        </div>
        <div class="row align-items-center py-3 px-xl-5">
            <div class="col-lg-3 d-none d-lg-block">
                <a href="" class="text-decoration-none">
                    <h1 class="m-0 display-5 font-weight-semi-bold"><span class="text-primary font-weight-bold border px-3 mr-1">E</span>Shopper</h1>
                </a>
            </div>
            <div class="col-lg-6 col-6 text-left">
                <form action="shop.html" method="GET">
                    <div class="input-group">
                        <input type="text" name="q" class="form-control" placeholder="Search for products">
                        <div class="input-group-append">
                            <button type="submit" class="input-group-text bg-transparent text-primary" style="border: 1px solid #ced4da; border-left: none;">
                                <i class="fa fa-search"></i>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
           <div class="col-lg-3 col-6 text-right">
    <a href="" class="btn border">
        <i class="fas fa-heart text-primary"></i>
        <span class="badge">0</span>
    </a>
    <a href="cart.html" class="btn border">
        <i class="fas fa-shopping-cart text-primary"></i>
        <!-- ตรวจสอบว่ามีคลาส badge อยู่ตรงนี้[cite: 1, 4, 8] -->
        <span class="badge" id="cart-badge">0</span> 
    </a>
</div>
        </div>
    </div>
    <!-- Topbar End -->

    <!-- Navbar Start -->
    <div class="container-fluid">
        <div class="row border-top px-xl-5">
            <div class="col-lg-3 d-none d-lg-block">
                <a class="btn shadow-none d-flex align-items-center justify-content-between bg-primary text-white w-100" data-toggle="collapse" href="#navbar-vertical" style="height: 65px; margin-top: -1px; padding: 0 30px;">
                    <h6 class="m-0">Categories</h6>
                    <i class="fa fa-angle-down text-dark"></i>
                </a>
                <nav class="collapse position-absolute navbar navbar-vertical navbar-light align-items-start p-0 border border-top-0 border-bottom-0 bg-light" id="navbar-vertical" style="width: calc(100% - 30px); z-index: 1;">
                    <div class="navbar-nav w-100 overflow-hidden" style="height: 410px">
                        <a href="" class="nav-item nav-link">Shirts</a>
                        <a href="" class="nav-item nav-link">Jeans</a>
                        <a href="" class="nav-item nav-link">Jackets</a>
                        <a href="" class="nav-item nav-link">Shoes</a>
                    </div>
                </nav>
            </div>
            <div class="col-lg-9">
                <nav class="navbar navbar-expand-lg bg-light navbar-light py-3 py-lg-0 px-0">
                    <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">
                        <div class="navbar-nav mr-auto py-0">
                            <a href="index.html" class="nav-item nav-link">Home</a>
                            <a href="shop.html" class="nav-item nav-link">Shop</a>
                            <a href="cart.html" class="nav-item nav-link active">Shop Cart</a>
                            <a href="checkout.html" class="nav-item nav-link">Checkout</a>
                            <a href="contact.html" class="nav-item nav-link">Contact</a>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </div>
    <!-- Navbar End -->

    <!-- Cart Start -->
    <div class="container-fluid pt-5">
        <div class="row px-xl-5">
            <div class="col-lg-8 table-responsive mb-5">
                <table class="table table-bordered text-center mb-0">
                    <thead class="bg-secondary text-dark">
                        <tr>
                            <th>Products</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Total</th>
                            <th>Remove</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items-list" class="align-middle">
                        <!-- รายการสินค้าจาก JavaScript จะมาแสดงที่นี่ -->
                    </tbody>
                </table>
            </div>
            <div class="col-lg-4">
                <div class="card border-secondary mb-5">
                    <div class="card-header bg-secondary border-0">
                        <h4 class="font-weight-semi-bold m-0">Cart Summary</h4>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-3 pt-1">
                            <h6 class="font-weight-medium">Subtotal</h6>
                            <h6 id="cart-subtotal" class="font-weight-medium">$0.00</h6> <!-- ใส่ ID เพื่อคำนวณเงิน -->
                        </div>
                        <div class="d-flex justify-content-between">
                            <h6 class="font-weight-medium">Shipping</h6>
                            <h6 class="font-weight-medium">$10.00</h6>
                        </div>
                    </div>
                    <div class="card-footer border-secondary bg-transparent">
                        <div class="d-flex justify-content-between mt-2">
                            <h5 class="font-weight-bold">Total</h5>
                            <h5 id="cart-total" class="font-weight-bold">$0.00</h5> <!-- ใส่ ID เพื่อคำนวณเงิน[cite: 1] -->
                        </div>
                        <button class="btn btn-block btn-primary my-3 py-3">Proceed To Checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Cart End -->

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script> <!-- ต้องเรียกไฟล์นี้เพื่อให้เลขตะกร้าด้านบนอัปเดต[cite: 1, 8] -->

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const cartList = document.getElementById('cart-items-list');
        const subtotalElement = document.getElementById('cart-subtotal');
        const totalElement = document.getElementById('cart-total');
        
        // ฟังก์ชันโหลดข้อมูลและแสดงผลในตะกร้า
        function renderCart() {
            // ดึงข้อมูลจาก LocalStorage[cite: 1, 8]
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            
            if (cart.length === 0) {
                cartList.innerHTML = '<tr><td colspan="5" class="py-5">ไม่มีสินค้าในตะกร้า</td></tr>';
                subtotalElement.innerText = '$0.00';
                totalElement.innerText = '$0.00';
                return;
            }

            cartList.innerHTML = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                // ลบสัญลักษณ์ $ และ , ออกเพื่อคำนวณตัวเลข[cite: 1, 8]
                let priceNum = parseFloat(item.price.replace(/[$,]/g, ''));
                let itemTotal = priceNum * item.quantity;
                subtotal += itemTotal;

                cartList.innerHTML += `
                    <tr>
                        <td class="align-middle"><img src="${item.image}" alt="" style="width: 50px;"> ${item.name}</td>
                        <td class="align-middle">$${priceNum.toFixed(2)}</td>
                        <td class="align-middle">
                            <div class="input-group quantity mx-auto" style="width: 100px;">
                                <input type="text" class="form-control form-control-sm bg-secondary text-center" value="${item.quantity}" readonly>
                            </div>
                        </td>
                        <td class="align-middle">$${itemTotal.toFixed(2)}</td>
                        <td class="align-middle">
                            <button class="btn btn-sm btn-primary" onclick="removeItem(${index})">
                                <i class="fa fa-times"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            // อัปเดตราคาสรุป[cite: 1]
            subtotalElement.innerText = '$' + subtotal.toFixed(2);
            totalElement.innerText = '$' + (subtotal + 10).toFixed(2); // บวกค่าส่ง $10
        }

        // ฟังก์ชันลบสินค้าออกจากตะกร้า[cite: 1]
        window.removeItem = function(index) {
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('shoppingCart', JSON.stringify(cart));
            renderCart();
            // เรียกฟังก์ชันอัปเดตตัวเลขตะกร้าด้านบนที่อยู่ใน main.js[cite: 1, 8]
            if(typeof updateCartBadge === 'function') updateCartBadge();
        }

        renderCart();
    });
    </script>
</body>
</html>
